<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AI Agent</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--primary-subtle); color: var(--primary); margin-bottom: var(--space-2);">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      </div>
      <h1>Create an Account</h1>
      <p>Sign up to start chatting with your AI assistant</p>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="toast toast-error" style="display: none; margin-bottom: var(--space-4); width: 100%; animation: none;" role="alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="name@example.com"
          required
          autocomplete="email"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="At least 8 characters"
          required
          minlength="8"
          autocomplete="new-password"
        >
        <div class="input-helper">Minimum 8 characters with letter and number recommended.</div>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-6);">
        <label for="confirm-password" class="form-label">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          class="form-input"
          placeholder="Re-enter your password"
          required
          minlength="8"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="register-btn" class="btn btn-primary btn-block" style="padding: 10px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { auth } from "./js/auth.js";
    import { ui } from "./js/ui.js";

    // Redirect to index if already authenticated
    auth.redirectIfAuthenticated();

    const form = document.getElementById("register-form");
    const errorBanner = document.getElementById("error-banner");
    const submitBtn = document.getElementById("register-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        errorBanner.textContent = "Passwords do not match. Please re-enter.";
        errorBanner.style.display = "flex";
        return;
      }

      if (password.length < 8) {
        errorBanner.textContent = "Password must be at least 8 characters long.";
        errorBanner.style.display = "flex";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner" style="width: 16px; height: 16px;"></span> Creating account...`;

      try {
        await auth.register(email, password);
        ui.showToast("Account created! Signing you in...", "success");

        // Automatically log the user in
        await auth.login(email, password, false);
        setTimeout(() => {
          window.location.href = window.location.pathname.startsWith("/ui/") ? "/ui/index.html" : "index.html";
        }, 400);
      } catch (err) {
        errorBanner.textContent = err.message || "Registration failed. Email may already be in use.";
        errorBanner.style.display = "flex";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
